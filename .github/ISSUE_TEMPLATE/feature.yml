name: Feature request
description: Suggest a new feature or capability
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For non-trivial features, please open a [discussion](../../discussions) first so we can talk through scope before you spend time on a PR.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case. Who is it for? What does the workflow look like today, and what's missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Sketch the API or config shape if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where do you think this change belongs?
      options:
        - This plugin (paperclip-plugin-line)
        - Upstream Paperclip (paperclipai/paperclip)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../CODE_OF_CONDUCT.md).
          required: true
